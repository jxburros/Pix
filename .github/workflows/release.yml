name: Windows installer and releases
on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]" build
      - run: pytest -q
      - name: Verify stable tag and package versions agree
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -c "import os; from pix import __version__; assert os.environ['RELEASE_TAG'] == 'v' + __version__"
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]" pyinstaller==6.16.0
      - run: pytest -q
      - name: Build bundled runtime, stable launcher, and installer
        shell: pwsh
        run: ./distribution/build_windows.ps1
      - name: Verify installation, PATH, native updates, and uninstall
        shell: pwsh
        run: ./distribution/test_windows_install.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/release/*
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [verify, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*distributions'
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release
      - name: Publish an immutable, fully uploaded stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "Pix $RELEASE_TAG" --generate-notes
          gh release upload "$RELEASE_TAG" release/*
          gh release edit "$RELEASE_TAG" --draft=false --latest
